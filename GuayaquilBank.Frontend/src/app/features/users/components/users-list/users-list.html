<div class="p-6 max-w-7xl mx-auto font-sans">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-base-content tracking-tight">Usuarios</h1>
      <p class="text-sm text-base-content/60 font-medium">Gestión de usuarios del sistema.</p>
    </div>
    <button (click)="openCreate()" class="btn btn-primary gap-2 self-start sm:self-auto shadow-md">
      <i class="pi pi-plus text-xs"></i>
      Nuevo Usuario
    </button>
  </div>

  <div class="mb-6">
    <app-data-filter (onSearch)="handleSearch($event)"></app-data-filter>
  </div>

  <app-generic-table
    [columns]="tableColumns"
    [data]="users()"
    [actions]="tableActions"
    [isLoading]="isLoading()"
    [currentPage]="page()"
    [totalPages]="totalPages()"
    [totalItems]="totalItems()"
    (pageChange)="page.set($event)"
    emptyMessage="No se encontraron usuarios registrados en este tenant."
    emptyIcon="pi-users">
  </app-generic-table>
</div>

<app-generic-modal
  #userModal
  title="Registrar / Editar Usuario"
  sizeClass="max-w-xl">

  <div modal-body class="relative">
    @if (isModalLoading()) {
      <div class="absolute inset-0 bg-base-100/80 z-10 flex flex-col items-center justify-center gap-3 rounded-xl min-h-75">
        <span class="loading loading-spinner loading-md text-primary"></span>
        <span class="text-xs font-semibold text-base-content/60">Procesando...</span>
      </div>
    }

    <app-user-form
      #userFormComponent
      (onSubmitForm)="onSaved($event)"
      (onCancel)="userModal.close()">
    </app-user-form>
  </div>

  <ng-container modal-footer>
    <button (click)="userModal.close()" class="btn btn-sm btn-ghost" [disabled]="isModalLoading()">Cancelar</button>
    <button (click)="userFormComponent.submit()" class="btn btn-sm btn-primary px-5 shadow-md gap-2" [disabled]="isModalLoading()">
      @if (isModalLoading()) { <span class="loading loading-spinner loading-xs"></span> }
      Guardar Usuario
    </button>
  </ng-container>
</app-generic-modal>
