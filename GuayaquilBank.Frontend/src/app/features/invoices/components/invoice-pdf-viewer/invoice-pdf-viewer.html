<div class="w-full flex flex-col bg-base-100 border border-base-300 rounded-2xl overflow-hidden shadow-lg h-[75vh]">

  <div class="flex items-center justify-between px-4 py-3 bg-base-200/60 border-b border-base-300">
    <div class="flex items-center gap-2">
      <i class="pi pi-file-pdf text-error text-lg"></i>
      <span class="text-sm font-bold text-base-content tracking-tight">Visor de Comprobante Electrónico</span>
    </div>

    <div class="flex items-center gap-2">
      <button (click)="loadPdf()" class="btn btn-sm btn-ghost btn-square text-base-content/60 hover:text-base-content" title="Recargar PDF" [disabled]="isLoading()">
        <i class="pi pi-refresh" [ngClass]="{ 'animate-spin': isLoading() }"></i>
      </button>
      <button (click)="openInNewTab()" class="btn btn-sm btn-primary btn-sm gap-2 text-xs shadow-sm" [disabled]="isLoading() || hasError()">
        <i class="pi pi-external-link text-xs"></i>
        Ver Pantalla Completa
      </button>
    </div>
  </div>

  <div class="flex-1 relative bg-base-300/30 flex items-center justify-center">

    @if (isLoading()) {
      <div class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 bg-base-100/50">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="text-xs font-semibold text-base-content/60 animate-pulse">Descargando flujo binario y firmando documento...</p>
      </div>
    }

    @if (hasError()) {
      <div class="text-center p-6 max-w-sm flex flex-col items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-error/10 flex items-center justify-center text-error mb-2">
          <i class="pi pi-exclamation-triangle text-xl"></i>
        </div>
        <h4 class="text-sm font-bold text-base-content">No se pudo cargar la factura</h4>
        <p class="text-xs text-base-content/50">El documento digital no se encuentra disponible o el UUID provisto no existe en el core de facturación.</p>
        <button (click)="loadPdf()" class="btn btn-sm btn-outline btn-error mt-2 px-4">Reintentar</button>
      </div>
    }

    @if (!hasError() && pdfUrl()) {
      <iframe
        [src]="pdfUrl()"
        class="w-full h-full border-none rounded-b-2xl bg-white"
        title="Factura PDF">
      </iframe>
    }
  </div>
</div>
