<div class="modal z-50 transition-all duration-200" [ngClass]="{ 'modal-open pointer-events-auto opacity-100': isOpen() }">

  <div class="modal-backdrop bg-neutral-focus/40" (click)="close()"></div>

  <div class="modal-box bg-base-100 border border-base-300 rounded-2xl shadow-xl relative p-6 transition-all duration-300"
       [ngClass]="sizeClass()">

    <div class="flex items-center justify-between pb-4 mb-4 border-b border-base-200">
      <h3 class="text-lg font-bold text-base-content tracking-tight">
        {{ title() }}
      </h3>

      <button (click)="close()" class="btn btn-sm btn-circle btn-ghost text-base-content/50 hover:text-error transition-colors">
        <i class="pi pi-times text-xs"></i>
      </button>
    </div>

    <div class="py-2">
      <ng-content select="[modal-body]"></ng-content>
    </div>

    <div class="modal-action mt-6 pt-4 border-t border-base-200 flex justify-end gap-2">
      <ng-content select="[modal-footer]"></ng-content>
    </div>

  </div>
</div>
