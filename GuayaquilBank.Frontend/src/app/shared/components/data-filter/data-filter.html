<div class="w-full max-w-md">
  <div class="relative flex items-center group">
    <span class="absolute left-4 text-base-content/40 group-focus-within:text-primary transition-colors duration-200">
      <i class="pi pi-search text-sm"></i>
    </span>

    <input
      type="text"
      [value]="searchQuery()"
      (input)="onInputChange($event)"
      placeholder="Buscar cliente, RUC o correo corporativo..."
      class="w-full h-11 pl-11 pr-4 bg-base-100/60 border border-base-300 rounded-xl text-sm font-medium text-base-content placeholder:text-base-content/30 transition-all duration-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 hover:bg-base-100/90 shadow-sm"
    />

    @if (searchQuery().length > 0) {
      <span class="absolute right-4 text-base-content/30 hover:text-base-content pointer-events-none animate-fade-in">
        <i class="pi pi-bars text-xs opacity-0"></i> </span>
    }
  </div>
</div>
